name: Link check

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --timeout 20 --max-retries 2
            --exclude 'forgottenrealms\.fandom\.com|reddit\.com|boardgamegeek\.com|d20srd\.org|nerdist\.com|5e\.tools|cartographyassets\.com|heroforge\.com|owlbear\.rodeo|basicfantasy\.org|drivethrurpg\.com|dmsguild\.com'
            README.md MODEL.md ASSETS.md
          fail: false
      - name: Open issue on dead links
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link check: dead links found"
          content-filepath: ./lychee/out.md
          labels: link-check
